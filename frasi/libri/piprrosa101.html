<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Piccolo Principe - La Rosa</title>
  <style>
    /* Reset e impostazioni di base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Sfondo cielo notturno */
      background: radial-gradient(circle at top right, #1b2755 0%, #0d1326 50%, #050811 100%);
      font-family: 'Georgia', serif;
      color: #f0f0f0;
      padding: 20px;
      overflow: hidden; /* Nasconde le stelle che escono dai bordi */
      position: relative;
    }

    /* Effetto cielo stellato sullo sfondo */
    .stars {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      background-color: #fff;
      border-radius: 50%;
      animation: twinkle infinite alternate;
    }
    .star:nth-child(1) { top: 15%; left: 20%; width: 3px; height: 3px; animation-duration: 1.5s; }
    .star:nth-child(2) { top: 25%; left: 80%; width: 2px; height: 2px; animation-duration: 2s; }
    .star:nth-child(3) { top: 75%; left: 15%; width: 4px; height: 4px; animation-duration: 1.8s; box-shadow: 0 0 5px #ffd700; }
    .star:nth-child(4) { top: 85%; left: 75%; width: 2px; height: 2px; animation-duration: 2.2s; }
    .star:nth-child(5) { top: 10%; left: 60%; width: 3px; height: 3px; animation-duration: 2.5s; }

    /* Card principale */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(13, 22, 48, 0.6);
      border: 1px solid rgba(255, 215, 0, 0.15); /* Bordo dorato leggero */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.05);
      text-align: center;
      /* Animazione di entrata e galleggiamento continuo */
      animation: fadeInUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, floatCard 6s ease-in-out infinite 1.5s;
    }

    /* Icona Rosa */
    .rose-icon {
      font-size: 3.5rem;
      margin-bottom: 25px;
      display: inline-block;
      filter: drop-shadow(0 0 15px rgba(229, 57, 53, 0.6));
      animation: gentleRock 4s ease-in-out infinite;
    }

    /* Citazione */
    blockquote {
      font-size: 1.6rem;
      line-height: 1.6;
      font-style: italic;
      color: #fdfbf7;
      margin-bottom: 35px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .quote-text {
      display: inline-block;
      opacity: 0;
      transform: translateY(15px);
      animation: textReveal 1s forwards ease-out 0.6s;
    }

    /* Evidenziazione dorata per parole chiave */
    .highlight {
      color: #ffd700;
      font-weight: normal;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    /* Autore e provenienza */
    .author-section {
      opacity: 0;
      transform: translateY(10px);
      animation: textReveal 1s forwards ease-out 1.2s;
    }

    .author {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b0c4de;
      font-weight: 500;
    }

    .book-title {
      display: block;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      color: #ffd700;
      margin-top: 8px;
      font-style: italic;
    }

    /* --- KEYFRAMES --- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes textReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes gentleRock {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      50% { transform: rotate(5deg) scale(1.05); }
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* --- RESPONSIVE MOBILE --- */
    @media (max-width: 480px) {
      .card {
        padding: 35px 25px;
        border-radius: 20px;
      }
      .rose-icon {
        font-size: 2.8rem;
        margin-bottom: 20px;
      }
      blockquote {
        font-size: 1.35rem;
        line-height: 1.5;
      }
      .author {
        font-size: 0.8rem;
        letter-spacing: 2px;
      }
      .book-title {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Sfondo stellato -->
  <div class="stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>

  <!-- Contenitore principale -->
  <main class="card">
    <div class="rose-icon">🌹</div>
    
    <blockquote>
      <span class="quote-text">
        "È il tempo che tu hai perduto per la tua <span class="highlight">rosa</span> <br>
        che ha fatto la tua rosa così <span class="highlight">importante</span>."
      </span>
    </blockquote>

    <div class="author-section">
      <div class="author">Antoine de Saint-Exupéry</div>
      <div class="book-title">Il Piccolo Principe</div>
    </div>
  </main>

</body>
</html>
